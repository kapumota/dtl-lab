name: DLT-Lab CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-demo-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar y ejecutar pruebas
        run: bash scripts/run_tests.sh

      - name: Ejecutar demo completa
        run: bash scripts/run_demo.sh

      - name: Ejecutar suite de seguridad y verificacion
        run: bash scripts/run_security_checks.sh
