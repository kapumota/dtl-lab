# Model checking obligatorio para el perfil científico del Paper 1.
name: formal-verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORMAL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  FORMAL_SOURCE_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  formal-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar cache de herramientas formales
        uses: actions/cache@v4
        with:
          path: .formal-tools
          key: formal-tools-${{ runner.os }}-${{ hashFiles('scripts/formal/tool_versions.env') }}

      - name: Instalar TLC versionado
        run: bash scripts/formal/install_tla_tools.sh

      - name: Instalar Alloy versionado
        run: bash scripts/formal/install_alloy.sh

      - name: Ejecutar configuraciones y mutantes
        run: make formal-research

      - name: Verificar resultados estructurados
        run: |
          test -s results/formal/tool_versions.txt
          test -s results/formal/environment.json
          test -s results/formal/tla_runs.csv
          test -s results/formal/alloy_runs.csv
          test -s results/formal/mutant_matrix.csv
          test -s results/formal/execution_manifest.json
          grep -q ",mutant," results/formal/tla_runs.csv
          grep -q ",mutant," results/formal/alloy_runs.csv
          test "$(find results/formal/counterexamples -type f | wc -l)" -ge 10
          python3 -m json.tool results/formal/execution_manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("results/formal/execution_manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("schema_version") != 3:
              raise SystemExit("El manifiesto formal debe usar schema_version 3.")
          if manifest.get("source_commit") != "${{ env.FORMAL_SOURCE_COMMIT }}":
              raise SystemExit("El manifiesto no conserva el commit fuente.")
          if manifest.get("run_counts", {}).get("total_runs") != 17:
              raise SystemExit("El manifiesto no registra las diecisiete ejecuciones.")
          alloy_mutants = [
              run
              for run in manifest.get("runs", [])
              if run.get("tool") == "Alloy" and run.get("kind") == "mutant"
          ]
          if len(alloy_mutants) != 5:
              raise SystemExit("Faltan reportes de mutantes Alloy.")
          if not all(run.get("target_property_failed") for run in alloy_mutants):
              raise SystemExit("Un mutante Alloy no violó su propiedad objetivo.")
          PY

      - name: Ejecutar conformidad científica basada en trazas
        run: make conformance-research

      - name: Verificar resultados de conformidad
        run: |
          test -s results/conformance/research-v1/manifest.json
          test -s results/conformance/research-v1/summary.json
          test -s results/conformance/research-v1/summary.md
          test -s results/conformance/research-v1/conformance_matrix.csv
          python3 -m json.tool results/conformance/research-v1/manifest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("results/conformance/research-v1/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest.get("schema_version") != 1:
              raise SystemExit("El manifiesto de conformidad debe usar schema_version 1.")
          if manifest.get("phase") != "7E":
              raise SystemExit("El manifiesto debe declarar la Fase 7E.")
          if manifest.get("source_commit") != "${{ env.FORMAL_SOURCE_COMMIT }}":
              raise SystemExit("El manifiesto no conserva el commit fuente.")
          counts = manifest.get("counts", {})
          if counts.get("valid_accepted") != 10:
              raise SystemExit("No se aceptaron los diez escenarios válidos.")
          if counts.get("negative_rejected") != 10:
              raise SystemExit("No se rechazaron las diez trazas corruptas.")
          if counts.get("diagnostics_matching") != 10:
              raise SystemExit("No coinciden los diez diagnósticos negativos.")
          PY

      - name: Ejecutar smoke científico de Fase 8C
        run: make experiment-scientific-smoke

      - name: Verificar smoke científico
        run: |
          test -s results/experiments/smoke-v1/raw-manifest.json
          test -s results/experiments/smoke-v1/environment.json
          test -s results/experiments/smoke-v1/provenance.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "results/experiments/smoke-v1/raw-manifest.json"
              ).read_text(encoding="utf-8")
          )
          if manifest.get("phase") != "8C":
              raise SystemExit("El smoke debe declarar Fase 8C.")
          if manifest.get("run_kind") != "scientific_smoke":
              raise SystemExit("El tipo de smoke no coincide.")
          counts = manifest.get("counts", {})
          if counts.get("tasks_total") != 6:
              raise SystemExit("El smoke debe contener seis tareas.")
          if counts.get("expectation_met") != 6:
              raise SystemExit("Las seis tareas deben cumplir su expectativa.")
          if counts.get("by_status", {}).get("completed") != 6:
              raise SystemExit("Las seis tareas smoke deben terminar completed.")
          PY

      - name: Publicar resultados formales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtl-lab-formal-results
          path: results/formal/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar resultados de conformidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtl-lab-conformance-results
          path: results/conformance/research-v1/
          if-no-files-found: error
          retention-days: 30
      - name: Publicar smoke científico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtl-lab-experiment-scientific-smoke
          path: results/experiments/smoke-v1/
          if-no-files-found: error
          retention-days: 30
